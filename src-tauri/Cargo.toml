[package]
name = "convenient-use"
version = "0.1.0"
description = "Windows/macOS 생산성 트레이 앱"
authors = ["enliple"]
edition = "2024"

[lib]
# Windows 에서 bin 이름과 충돌하지 않도록 _lib 접미사를 붙인다 (cargo#8519)
name = "convenient_use_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
